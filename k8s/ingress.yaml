apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-counter
  namespace: flask-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: flask-counter.local  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flask-counter
            port:
              number: 80 