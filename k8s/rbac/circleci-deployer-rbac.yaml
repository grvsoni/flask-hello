# RBAC that lets the CircleCI container-runner task pods deploy into the
# flask-app namespace. Apply this ONCE with cluster-admin credentials:
#   kubectl apply -f k8s/rbac/circleci-deployer-rbac.yaml
#
# The ServiceAccount lives in the "circleci" namespace because container-runner
# task pods are launched there. It is granted (via a namespaced Role) only the
# permissions needed to manage the app resources in the "flask-app" namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flask-deployer
  namespace: circleci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flask-deployer
  namespace: flask-app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flask-deployer
  namespace: flask-app
subjects:
  - kind: ServiceAccount
    name: flask-deployer
    namespace: circleci
roleRef:
  kind: Role
  name: flask-deployer
  apiGroup: rbac.authorization.k8s.io
