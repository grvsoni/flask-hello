apiVersion: v1
kind: Service
metadata:
  name: flask-counter
  namespace: <+pipeline.variables.namespace>
  labels:
    app: flask-counter
    env: <+pipeline.variables.env>
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: flask-counter
    env: <+pipeline.variables.env>