# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/reference/configuration-reference/

# For a detailed guide to building and testing with Python, read the docs:
# https://circleci.com/docs/guides/getting-started/language-python/ for more details
version: 2.1

# Orbs are reusable packages of CircleCI configuration that you may share across projects, enabling you to create encapsulated, parameterized commands, jobs, and executors that can be used across multiple projects.
# See: https://circleci.com/docs/orbs/use/orb-intro/
orbs:
  # See the Python orb documentation here: https://circleci.com/developer/orbs/orb/circleci/python
  python: circleci/python@2.1.1
  # Snyk orb for scanning dependencies for known vulnerabilities.
  # See: https://circleci.com/developer/orbs/orb/snyk/snyk
  snyk: snyk/snyk@2.3.0
  # Node orb, used to install Node.js so snyk-to-html can render the report.
  # See: https://circleci.com/developer/orbs/orb/circleci/node
  node: circleci/node@7.2.1

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#jobs-overview & https://circleci.com/docs/reference/configuration-reference/#jobs
jobs:
  build-and-test:
    # Run the job across multiple parallel executors so tests can be split
    # between them ("smarter testing" / test splitting).
    # See: https://circleci.com/docs/guides/test/getting-started-with-smarter-testing/
    parallelism: 2
    # Specify the execution environment. You can specify an image from Docker Hub or use one of our convenience images from CircleCI's Developer Hub.
    # See: https://circleci.com/docs/guides/execution-managed/executor-intro/ & https://circleci.com/docs/reference/configuration-reference/#executor-job
    docker:
      # Specify the version you desire here
      # See:https://circleci.com/developer/images/image/cimg/python
      - image: cimg/python:3.12

    # Add steps to the job
    # See: https://circleci.com/docs/guides/orchestrate/jobs-steps/#steps-overview & https://circleci.com/docs/reference/configuration-reference/#steps
    steps:
      # Checkout the code as the first step.
      - checkout
      - python/install-packages:
          pkg-manager: pip
          # app-dir: ~/project/package-directory/  # If your requirements.txt isn't in the root directory.
          # pip-dependency-file: test-requirements.txt  # if you have a different name for your requirements file, maybe one that combines your runtime and test requirements.
      - run:
          name: Run Bandit security scan
          # Bandit is a static analysis tool for finding common security issues in Python code.
          # -ll fails the build only on medium or higher severity findings.
          command: |
            pip install bandit
            bandit -r . -x ./tests,./venv -ll
      - snyk/scan:
          # Scan dependencies for known vulnerabilities.
          # Requires the SNYK_TOKEN env var (set it as a project/context variable).
          # Do not fail here so the JSON/HTML reports are always produced and
          # uploaded as artifacts; the high-severity gate is enforced below.
          fail-on-issues: false
          monitor-on-build: false
          # Write the full results to JSON for archiving and HTML rendering.
          additional-test-arguments: "--json-file-output=snyk-results.json"
      # Upload the raw Snyk JSON report as a build artifact.
      # See: https://circleci.com/docs/guides/optimize/artifacts/
      - store_artifacts:
          path: snyk-results.json
          destination: snyk-results.json
      # Install Node.js so we can use snyk-to-html (an npm package).
      - node/install
      - run:
          name: Render Snyk results to HTML
          # See: https://github.com/snyk/snyk-to-html
          # Run even if a previous step failed so the report is always generated.
          command: |
            npm install -g snyk-to-html
            snyk-to-html -i snyk-results.json -o snyk-results.html
          when: always
      # Upload the human-friendly HTML report as a build artifact.
      - store_artifacts:
          path: snyk-results.html
          destination: snyk-results.html
      - run:
          name: Fail build on high or critical Snyk vulnerabilities
          # Enforce the severity gate using the already-generated JSON report.
          command: |
            if [ ! -f snyk-results.json ]; then
              echo "No Snyk results file found; skipping gate."
              exit 0
            fi
            if jq -e '[.. | objects | select(.severity? == "high" or .severity? == "critical")] | length == 0' snyk-results.json > /dev/null; then
              echo "No high or critical vulnerabilities found."
            else
              echo "High or critical vulnerabilities found — failing build."
              exit 1
            fi
      - run:
          name: Run tests
          # Smarter testing: split the test files across the parallel executors
          # using timing data from previously stored test results, so each node
          # runs a balanced subset. The JUnit XML keeps feeding timing data.
          # See: https://circleci.com/docs/guides/test/getting-started-with-smarter-testing/
          command: |
            set -e
            mkdir -p test-results
            TESTFILES=$(circleci tests glob "tests/test_*.py" | circleci tests split --split-by=timings)
            if [ -z "$TESTFILES" ]; then
              echo "No test files allotted to this parallel node; skipping."
              exit 0
            fi
            echo "Running on this node: $TESTFILES"
            pytest --junitxml=test-results/junit.xml $TESTFILES
      - store_test_results:
          path: test-results
      # Also archive the JUnit XML as a downloadable artifact.
      - store_artifacts:
          path: test-results
          destination: test-results

  # Build the Docker image and push it to Docker Hub.
  build-and-push-image:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      # A remote Docker environment is required to build images from a Docker executor.
      # See: https://circleci.com/docs/building-docker-images/
      - setup_remote_docker
      - run:
          name: Build and push Docker image to Docker Hub
          # Reuses docker-push.sh, which builds grvsoniharness/flask-counter:v<VERSION>
          # and :latest, then pushes both. Requires DOCKER_USERNAME and DOCKER_PASSWORD
          # to be set as project environment variables in CircleCI.
          command: |
            chmod +x docker-push.sh
            ./docker-push.sh

  # Deploy the latest published image to the local Kubernetes cluster.
  # This runs on a SELF-HOSTED CircleCI runner installed on the machine that has
  # kubectl access to the local cluster (CircleCI cloud executors cannot reach a
  # local/localhost cluster). See: https://circleci.com/docs/runner-overview/
  deploy-to-k8s:
    machine: true
    # Replace with your runner's resource class, in the form <namespace>/<resource-class>.
    resource_class: grvsoniharness/flask-app
    steps:
      - checkout
      - run:
          name: Deploy latest image to local Kubernetes cluster
          command: |
            # Ensure the target namespace exists.
            kubectl get namespace flask-app >/dev/null 2>&1 || kubectl create namespace flask-app
            # Apply the manifests (each manifest already sets namespace: flask-app).
            kubectl apply -f k8s/
            # Force a new rollout so the latest image is pulled, then wait for it.
            kubectl rollout restart deployment/flask-counter -n flask-app
            kubectl rollout status deployment/flask-counter -n flask-app --timeout=120s
  build:
    docker:
      - image: cimg/base:current
    resource_class: grvsoniharness/flask-app
    steps:
      - run: echo "Hi I'm on a Container Runner!"

# Orchestrate jobs using workflows
# See: https://circleci.com/docs/guides/orchestrate/workflows/ & https://circleci.com/docs/reference/configuration-reference/#workflows
workflows:
  flask-hello-job: # This is the name of the workflow, feel free to change it to better match your workflow.
    # Inside the workflow, you define the jobs you want to run.
    jobs:
      - build-and-test
      # Only build and push the image after tests pass.
      - build-and-push-image:
          requires:
            - build-and-test
      # Deploy to the local k8s cluster after the image is published.
      - deploy-to-k8s:
          requires:
            - build-and-push-image
  build-workflow:
    jobs:
      - build