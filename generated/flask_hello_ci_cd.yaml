pipeline:
  name: Flask Hello CI CD
  identifier: flask_hello_ci_cd
  orgIdentifier: Demo
  projectIdentifier: harness
  properties:
    ci:
      codebase:
        connectorRef: grvsoni_flask_hello
        repoName: flask-hello
        build:
          type: branch
          spec:
            branch: <+input>.default(circleci-project-setup)
  variables:
    - name: image_repo
      type: String
      value: grvsoniharness/flask-counter
    - name: har_generic_registry
      type: String
      value: <+input>.default(ci-artifacts)
  stages:
    # The three CircleCI jobs that were CI work (build-and-test and
    # build-and-push-image) are merged into ONE CI stage. They share the same
    # Cloud executor and were joined only by a workspace handoff, so one stage
    # keeps /harness and the host Docker daemon shared across all steps: the
    # image built here stays in the daemon for the scanners and the push, with
    # no cross-container tar transport (the previous separate-stage design
    # failed because the native tar export never reached the STO scanners).
    - stage:
        name: Build Test Scan Push
        identifier: build_test_scan_push
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          caching:
            enabled: true
            key: v1-pip-{{ checksum "requirements.txt" }}
            paths:
              - /harness/venv
          execution:
            steps:
              - step:
                  identifier: install_dependencies
                  name: Install Python dependencies
                  type: Run
                  description: "Translates python/install-packages (circleci/python@2.1.1, pkg-manager: pip). Installs into a venv under /harness so the packages survive into later steps' fresh containers; created only when the cache restore did not already provide one."
                  spec:
                    connectorRef: account.harnessImage
                    image: cimg/python:3.12
                    shell: Bash
                    command: |
                      set -eo pipefail
                      if [ ! -x /harness/venv/bin/pip ]; then
                        python -m venv /harness/venv
                      fi
                      /harness/venv/bin/pip install -r requirements.txt
              - step:
                  identifier: bandit_scan
                  name: Bandit security scan
                  type: Bandit
                  description: Translates the "Run Bandit security scan" run step (bandit -r . -x ./tests,./venv -ll). Native scanner step; severity medium maps to CircleCI's -ll threshold.
                  spec:
                    mode: orchestration
                    config: default
                    target:
                      type: repository
                      detection: manual
                      name: flask-hello
                      variant: <+codebase.branch>
                      workspace: /harness
                    advanced:
                      fail_on_severity: medium
                      args:
                        # GLOB excludes: bandit runs with an absolute root
                        # (-r /harness); relative excludes like "tests,venv" match
                        # nothing, so the venv/pip-cache created by
                        # install_dependencies would leak in as hundreds of
                        # findings and fail the gate.
                        cli: "-x '*/venv/*,*/tests/*,*/.cache/*,*/.git/*'"
              - step:
                  identifier: snyk_dependency_scan
                  name: Snyk dependency scan
                  type: Run
                  description: "Translates snyk/scan (snyk/snyk@2.3.0) + the CircleCI high/critical jq gate. Run step (not the STO Snyk step) because Snyk's Python OSS scan needs the deps installed in the SAME environment; the isolated STO runner errored with SNYK-OS-PYTHON-0013. Activates the /harness/venv install_dependencies populated. Produces snyk-results.json for the report steps; --severity-threshold=high enforces the gate."
                  spec:
                    connectorRef: account.harnessImage
                    image: cimg/python:3.12
                    shell: Bash
                    envVariables:
                      SNYK_TOKEN: <+secrets.getValue("account.snyk_api_token")>
                    command: |
                      set -eo pipefail
                      # Install the CLI OUTSIDE /harness: /harness is the Docker
                      # build context, and a binary left in it gets baked into the
                      # image by `COPY . .` and then flagged by the image scan.
                      mkdir -p /tmp/tools
                      curl -sfL https://downloads.snyk.io/cli/stable/snyk-linux -o /tmp/tools/snyk
                      chmod +x /tmp/tools/snyk
                      export PATH="/tmp/tools:$PATH"
                      source /harness/venv/bin/activate
                      snyk test --json-file-output=snyk-results.json --severity-threshold=high
              - step:
                  identifier: generate_snyk_html
                  name: Render Snyk HTML report
                  type: Run
                  description: "Renders snyk-to-html from the JSON produced by snyk_dependency_scan (when: always). node:22 because snyk-to-html is an npm tool; it does not re-scan. Guarantees both report files exist so the HarUpload steps never fail on a missing file."
                  when:
                    stageStatus: All
                  spec:
                    connectorRef: account.harnessImage
                    image: node:22
                    shell: Bash
                    command: |
                      set -eo pipefail
                      [ -f snyk-results.json ] || echo '{}' > snyk-results.json
                      npm install -g snyk-to-html
                      snyk-to-html -i snyk-results.json -o snyk-results.html || true
                      [ -f snyk-results.html ] || echo '<html><body>No Snyk report generated.</body></html>' > snyk-results.html
              - step:
                  identifier: upload_snyk_json_report
                  name: Upload Snyk JSON report
                  type: HarUpload
                  when:
                    stageStatus: All
                  spec:
                    registryRef: <+pipeline.variables.har_generic_registry>
                    packageType: GENERIC
                    packageName: snyk-reports
                    packageVersion: build-<+pipeline.sequenceId>
                    sourcePath: snyk-results.json
                    target: snyk-results.json
              - step:
                  identifier: upload_snyk_html_report
                  name: Upload Snyk HTML report
                  type: HarUpload
                  when:
                    stageStatus: All
                  spec:
                    registryRef: <+pipeline.variables.har_generic_registry>
                    packageType: GENERIC
                    packageName: snyk-reports
                    packageVersion: build-<+pipeline.sequenceId>
                    sourcePath: snyk-results.html
                    target: snyk-results.html
              - step:
                  identifier: run_tests
                  name: Run tests
                  type: Run
                  description: "Translates pytest + store_test_results. Plain Run + JUnit reports instead of the Test Intelligence step (the TI runner drops inline prep commands like mkdir/venv activation). Deliberate difference: CircleCI's parallelism: 2 + `circleci tests split` sharding is deferred -- the suite is one file / 5 tests, so one run is equivalent."
                  spec:
                    connectorRef: account.harnessImage
                    image: cimg/python:3.12
                    shell: Bash
                    command: |
                      set -eo pipefail
                      mkdir -p test-results
                      source /harness/venv/bin/activate
                      pytest --junitxml=test-results/junit.xml
                    reports:
                      type: JUnit
                      spec:
                        paths:
                          - test-results/junit.xml
              - step:
                  identifier: package_test_results
                  name: Package test results
                  type: Run
                  description: Packs the JUnit XML into one archive so it can be stored as a single GENERIC package file (HarUpload uploads one file per step).
                  when:
                    stageStatus: All
                  spec:
                    connectorRef: account.harnessImage
                    image: cimg/python:3.12
                    shell: Bash
                    command: |
                      set -eo pipefail
                      tar -czf test-results.tgz test-results
              - step:
                  identifier: upload_test_results
                  name: Upload JUnit XML archive
                  type: HarUpload
                  when:
                    stageStatus: All
                  spec:
                    registryRef: <+pipeline.variables.har_generic_registry>
                    packageType: GENERIC
                    packageName: test-results
                    packageVersion: build-<+pipeline.sequenceId>
                    sourcePath: test-results.tgz
                    target: test-results.tgz
              # ---- Image build / scan / push (was job build-and-push-image) ----
              # These run on the Cloud VM host (no step image), so they share the
              # host Docker daemon and /harness. docker save produces a real
              # docker archive that the CLI scanners read with the repo's
              # .trivyignore/.snyk + --ignore-unfixed -- exactly docker-push.sh +
              # the CircleCI scan gate. No step `when` => they run only if the
              # test/scan steps above kept the stage green.
              - step:
                  identifier: build_image
                  name: Build image and export tar
                  type: Run
                  description: "Translates ./docker-push.sh build. Runs on the Cloud VM (no image) to use the host Docker daemon. Logs in to Docker Hub (base-image pull + later push), builds both tags, and docker-saves a tar into shared /harness for the scanners."
                  spec:
                    shell: Bash
                    envVariables:
                      IMAGE_REPO: <+pipeline.variables.image_repo>
                      DOCKER_USERNAME: grvsoniharness
                      DOCKER_PASSWORD: <+secrets.getValue("account.docker-harness-password")>
                    command: |
                      set -eo pipefail
                      VERSION=$(cat VERSION | tr -d '[:space:]')
                      IMAGE="$IMAGE_REPO:v$VERSION"
                      echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
                      docker build -t "$IMAGE" -t "$IMAGE_REPO:latest" .
                      docker save -o /harness/flask-counter.tar "$IMAGE"
              - parallel:
                  - step:
                      identifier: trivy_image_scan
                      name: Trivy image scan
                      type: Run
                      description: "Translates the parallel Trivy gate. CLI scan of the docker-save tar with --ignore-unfixed and the repo .trivyignore (the native STO step could neither read .trivyignore nor ignore unfixed base-image CVEs). Fails the stage on HIGH/CRITICAL."
                      spec:
                        shell: Bash
                        command: |
                          set -eo pipefail
                          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /tmp/tools
                          export PATH="/tmp/tools:$PATH"
                          trivy image --input /harness/flask-counter.tar \
                            --severity HIGH,CRITICAL --exit-code 1 \
                            --ignore-unfixed --ignorefile /harness/.trivyignore
                  - step:
                      identifier: snyk_image_scan
                      name: Snyk container scan
                      type: Run
                      description: "Translates the parallel Snyk container gate. CLI scan of the docker-save tar with the repo .snyk policy (--policy-path). Fails the stage on high/critical."
                      spec:
                        shell: Bash
                        envVariables:
                          SNYK_TOKEN: <+secrets.getValue("account.snyk_api_token")>
                        command: |
                          set -eo pipefail
                          mkdir -p /tmp/tools
                          curl -sfL https://downloads.snyk.io/cli/stable/snyk-linux -o /tmp/tools/snyk
                          chmod +x /tmp/tools/snyk
                          export PATH="/tmp/tools:$PATH"
                          snyk container test "docker-archive:/harness/flask-counter.tar" \
                            --severity-threshold=high --policy-path=/harness/.snyk
              - step:
                  identifier: push_image
                  name: Push image to Docker Hub
                  type: Run
                  description: "Translates ./docker-push.sh push. Runs only if the scans above kept the stage green (no `when` => OnStageSuccess), preserving the scan-then-publish gate. Pushes both tags from the host daemon."
                  spec:
                    shell: Bash
                    envVariables:
                      IMAGE_REPO: <+pipeline.variables.image_repo>
                      DOCKER_USERNAME: grvsoniharness
                      DOCKER_PASSWORD: <+secrets.getValue("account.docker-harness-password")>
                    command: |
                      set -eo pipefail
                      VERSION=$(cat VERSION | tr -d '[:space:]')
                      IMAGE="$IMAGE_REPO:v$VERSION"
                      echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
                      docker push "$IMAGE"
                      docker push "$IMAGE_REPO:latest"
    - stage:
        name: Deploy to Local K8s
        identifier: deploy_to_local_k8s
        type: Deployment
        # Live plan creation requires >= 1 stage failure strategy. The CircleCI
        # job simply failed without rollback, so: fail fast (Abort), no
        # StageRollback. rollbackSteps below remain for manual rollback only.
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: flask_counter
            serviceInputs:
              serviceDefinition:
                type: Kubernetes
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: flask_counter_image
                      sources:
                        - identifier: flask_counter_image
                          type: DockerRegistry
                          spec:
                            connectorRef: account.dockerharness
                            imagePath: <+pipeline.variables.image_repo>
                            tag: <+input>.default(latest)
          environment:
            environmentRef: local_k8s
            deployToAll: false
            infrastructureDefinitions:
              - identifier: flask_app_namespace
          execution:
            steps:
              - step:
                  identifier: rolling_deploy
                  name: Rolling deploy
                  type: K8sRollingDeploy
                  timeout: 10m
                  description: Translates kubectl apply of the three manifests plus rollout restart + rollout status. The rollout-status wait matches the step timeout; pruning is off because plain kubectl apply never deleted unmanaged resources.
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
            rollbackSteps:
              - step:
                  identifier: rolling_rollback
                  name: Rolling rollback
                  type: K8sRollingRollback
                  timeout: 10m
                  description: The CircleCI job had no rollback logic; this step is provided for manual rollback of a failed deployment only (no automatic StageRollback failure strategy is configured, matching the source).
                  spec: {}
